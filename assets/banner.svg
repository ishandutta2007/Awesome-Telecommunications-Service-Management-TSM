<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a18cd1"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulse-ring {
        0% { transform: scale(0.6); opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes float-slow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -80; }
      }
      @keyframes beacon-ping {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes shimmer {
        0% { stop-color: #00f2fe; }
        50% { stop-color: #f72585; }
        100% { stop-color: #00f2fe; }
      }
      .ring-anim-1 {
        transform-origin: 150px 180px;
        animation: pulse-ring 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .ring-anim-2 {
        transform-origin: 150px 180px;
        animation: pulse-ring 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 2s;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash-flow 3s linear infinite;
      }
      .float-badge {
        animation: float-slow 6s ease-in-out infinite;
      }
      .beacon-dot {
        animation: beacon-ping 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Perspective Grid (Telecom Grid Fabric) -->
  <g opacity="0.4">
    <line x1="0" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="200" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="400" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="600" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="800" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="1000" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>
    <line x1="1200" y1="420" x2="600" y2="280" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>

    <ellipse cx="600" cy="380" rx="550" ry="80" fill="none" stroke="#00f2fe" stroke-width="0.6" opacity="0.2"/>
    <ellipse cx="600" cy="350" rx="420" ry="55" fill="none" stroke="#00f2fe" stroke-width="0.6" opacity="0.25"/>
    <ellipse cx="600" cy="320" rx="280" ry="35" fill="none" stroke="#00f2fe" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Network Topology Signal Beacons & Lines (Background Dynamic Layer) -->
  <g opacity="0.75">
    <!-- Left Antenna / Tower Node -->
    <circle cx="150" cy="180" r="45" fill="none" stroke="#00f2fe" stroke-width="1.5" class="ring-anim-1" opacity="0.7"/>
    <circle cx="150" cy="180" r="75" fill="none" stroke="#4facfe" stroke-width="1.2" class="ring-anim-2" opacity="0.4"/>
    <circle cx="150" cy="180" r="6" fill="#00f2fe" filter="url(#neon-glow)" class="beacon-dot"/>

    <!-- Right Telecom Edge Node -->
    <circle cx="1060" cy="160" r="35" fill="none" stroke="#a18cd1" stroke-width="1.2" opacity="0.5"/>
    <circle cx="1060" cy="160" r="6" fill="#a18cd1" filter="url(#neon-glow)" class="beacon-dot"/>

    <!-- Dynamic Flow Lines -->
    <path d="M 150 180 Q 400 90, 600 130 T 1060 160" fill="none" stroke="#00f2fe" stroke-width="1.8" class="flow-line" opacity="0.65"/>
    <path d="M 150 180 Q 300 270, 600 260 T 1060 160" fill="none" stroke="#f72585" stroke-width="1.2" class="flow-line" opacity="0.5"/>
    <path d="M 600 130 L 600 260" fill="none" stroke="#4facfe" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- Satellite / Network Satellites Floating -->
    <g transform="translate(1020, 80) scale(0.7)" class="float-badge">
      <rect x="0" y="0" width="90" height="26" rx="13" fill="#1b263b" stroke="#00f2fe" stroke-width="1" opacity="0.8"/>
      <text x="45" y="17" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5G SA / BSS</text>
    </g>
    <g transform="translate(90, 80) scale(0.7)" class="float-badge">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#1b263b" stroke="#4facfe" stroke-width="1" opacity="0.8"/>
      <text x="50" y="17" fill="#4facfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TM FORUM ODA</text>
    </g>
  </g>

  <!-- Central Glow Backdrop Behind Title (Prevents dynamic elements from obscuring text) -->
  <ellipse cx="600" cy="195" rx="440" ry="120" fill="#0a0e1a" opacity="0.85"/>
  <rect x="180" y="80" width="840" height="240" rx="20" fill="#0d1b2a" fill-opacity="0.65" stroke="#4facfe" stroke-width="1" stroke-opacity="0.3" filter="url(#card-shadow)"/>

  <!-- Foreground Content: Brand Badge -->
  <g transform="translate(600, 115)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1b263b" stroke="url(#accent-grad)" stroke-width="1.2"/>
    <circle cx="-118" cy="0" r="4" fill="#00f2fe" filter="url(#neon-glow)"/>
    <text x="5" y="5" fill="#e0e1dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">TELECOM OSS / BSS ECOSYSTEM</text>
  </g>

  <!-- Foreground Main Title -->
  <text x="600" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
    📡 Telecommunications Service Management
  </text>
  <text x="600" y="222" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle" filter="url(#neon-glow)">
    (TSM &amp; Service Orchestration)
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text x="600" y="262" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" text-anchor="middle">
    Curated SaaS Platforms • Open-Source Billing &amp; Provisioning • Carrier-Grade Network Automation
  </text>

  <!-- Status / Pill Badges at Bottom Foreground -->
  <g transform="translate(600, 298)">
    <!-- Pill 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#162238" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Real-Time OCS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#162238" stroke="#818cf8" stroke-width="0.8"/>
      <text x="0" y="4" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🌐 Cloud BSS/OSS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(80, 0)">
      <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#162238" stroke="#34d399" stroke-width="0.8"/>
      <text x="0" y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">📶 5G / Core Slicing</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(240, 0)">
      <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#162238" stroke="#f472b6" stroke-width="0.8"/>
      <text x="0" y="4" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🤖 AI Telco Ops</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
